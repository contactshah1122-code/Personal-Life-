<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="parchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#parchBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Archival Book / Chronicle Binder -->
  <g transform="translate(140, 70)">
    <rect x="0" y="0" width="320" height="230" rx="10" fill="#0B1120" stroke="#334155" stroke-width="2"/>
    <!-- Binder Spine -->
    <rect x="0" y="0" width="35" height="230" rx="4" fill="#1E293B" stroke="#475569"/>
    <line x1="17" y1="20" x2="17" y2="210" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4"/>
    
    <!-- Archival Pages Content -->
    <text x="60" y="45" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="#FDE68A">PERSONAL ARCHIVE LEDGER</text>
    <line x1="60" y1="55" x2="290" y2="55" stroke="#334155" stroke-width="1"/>
    
    <!-- Ruled lines with notes -->
    <line x1="60" y1="80" x2="280" y2="80" stroke="#1E293B" stroke-width="1"/>
    <line x1="60" y1="105" x2="270" y2="105" stroke="#1E293B" stroke-width="1"/>
    <line x1="60" y1="130" x2="285" y2="130" stroke="#1E293B" stroke-width="1"/>
    <line x1="60" y1="155" x2="250" y2="155" stroke="#1E293B" stroke-width="1"/>

    <text x="60" y="98" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Ref: SA-ARCHIVE-LEDGER-01</text>
    <text x="60" y="123" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#E2E8F0">"Preserving truth, milestones &amp; growth."</text>

    <!-- Wax / Gold Archival Seal -->
    <circle cx="270" cy="180" r="26" fill="url(#goldSeal)"/>
    <circle cx="270" cy="180" r="22" fill="#0B1120"/>
    <text x="270" y="186" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="#F59E0B" text-anchor="middle">SA</text>
  </g>

  <text x="300" y="40" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="1">THE LIVING MANUSCRIPT</text>
  <text x="300" y="360" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">[CURATED CHRONICLE OF SAWAL AHMED]</text>
</svg>
