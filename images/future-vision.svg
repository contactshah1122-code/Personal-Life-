<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0E162B"/>
      <stop offset="100%" stop-color="#1B2A4A"/>
    </linearGradient>
    <linearGradient id="glowGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <radialGradient id="aurora" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#spaceGrad)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="300" cy="150" r="180" fill="url(#aurora)"/>

  <!-- Compass / Star of Ambition -->
  <g transform="translate(300, 180)">
    <!-- Star rays -->
    <polygon points="0,-85 14,-20 85,0 14,20 0,85 -14,20 -85,0 -14,-20" fill="url(#glowGold)"/>
    <!-- Diagonals -->
    <polygon points="0,-45 9,-12 45,0 9,12 0,45 -9,12 -45,0 -9,-12" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="0" cy="0" r="10" fill="#0B1120" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#FEF08A"/>
    <!-- Orbital Rings -->
    <ellipse cx="0" cy="0" rx="120" ry="40" fill="none" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(-20)"/>
    <ellipse cx="0" cy="0" rx="120" ry="40" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 6" transform="rotate(25)"/>
  </g>

  <!-- Constellations & Horizon Line -->
  <line x1="60" y1="320" x2="540" y2="320" stroke="#475569" stroke-width="1.5"/>
  <circle cx="150" cy="320" r="4" fill="#38BDF8"/>
  <circle cx="300" cy="320" r="6" fill="#F59E0B"/>
  <circle cx="450" cy="320" r="4" fill="#10B981"/>

  <text x="300" y="45" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="1">FUTURE HORIZONS &amp; ASPIRATIONS</text>
  <text x="300" y="365" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8" text-anchor="middle">[VISION 2026-2035: PURPOSE, IMPACT &amp; PERPETUAL EXPLORATION]</text>
</svg>
