  <path d="M300 340 C280 365, 230 375, 170 370 M300 340 C320 365, 370 375, 430 370 M300 340 L300 385 M285 355 L240 380 M315 355 L360 380" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Glowing leaf/blossom nodes representing childhood memories -->
  <circle cx="220" cy="100" r="7" fill="#FBBF24"/>
  <circle cx="380" cy="100" r="7" fill="#FBBF24"/>
  <circle cx="180" cy="170" r="6" fill="#FBBF24"/>
  <circle cx="420" cy="170" r="6" fill="#FBBF24"/>
  <circle cx="300" cy="80" r="8" fill="#FDE68A"/>
  
  <text x="300" y="50" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="1">ROOTS &amp; FOUNDATIONS</text>
  <text x="300" y="380" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">[ARCHIVE CHAPTER I: EARLY ORIGINS &amp; FAMILY TRADITIONS]</text>
