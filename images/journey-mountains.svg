<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mountFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mountClose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#sky)" stroke="#334155" stroke-width="1.5"/>

  <!-- Distant mountain peaks -->
  <polygon points="50,280 170,140 280,280" fill="url(#mountFar)"/>
  <polygon points="220,280 340,110 460,280" fill="url(#mountFar)"/>
  <polygon points="400,280 500,160 580,280" fill="url(#mountFar)"/>

  <!-- Snow / Golden summit caps -->
  <polygon points="340,110 315,150 365,150" fill="url(#gold)"/>
  <polygon points="170,140 150,170 190,170" fill="url(#gold)"/>
  <polygon points="500,160 480,190 520,190" fill="url(#gold)"/>

  <!-- Closer mountain ridges -->
  <polygon points="0,380 120,220 290,380" fill="url(#mountClose)"/>
  <polygon points="240,380 410,200 600,380" fill="url(#mountClose)"/>

  <!-- Pathway / Trail of life -->
  <path d="M410 380 Q340 330 310 300 Q280 270 290 250" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  <circle cx="290" cy="250" r="5" fill="#FBBF24"/>

  <!-- Sun / Dawn of new horizon -->
  <circle cx="340" cy="80" r="28" fill="#F59E0B" fill-opacity="0.25"/>
  <circle cx="340" cy="80" r="18" fill="#FBBF24"/>

  <text x="300" y="45" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="1">EXPEDITIONS &amp; HORIZONS</text>
  <text x="300" y="375" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">[PHOTO ARCHIVE: PEAKS, TRAVELS &amp; MILESTONE EXPEDITIONS]</text>
</svg>
